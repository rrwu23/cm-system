<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update score &middot; RR research</title>
<style>
  /* ---------- Design tokens: the amber pair home.html is built on ---------- */
  :root {
    --bg: #eef2f8;
    --surface: #ffffff;
    --ink: #17233b;
    --ink-soft: #5c6a84;
    --ink-faint: #8d99ae;
    --line: #dde4ef;
    --amber: #ffd24a;
    --amber-strong: #e5a900;
    --amber-soft: #fff5cc;
    --amber-hover: #fff8dc;
    --amber-lit: #fffdf2;
    --amber-ink: #3a2c00;
    --amber-placeholder: #9c8438;
    --blue-soft: #e4edfa;
    --blue-line: #c2d4ee;
    --blue-ink: #21456f;
    --focus: #2f6fed;
    --danger: #a3312d;
    --done: #1d6b46;
    --warn: #9a5b00;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(23, 35, 59, .06);
    --shadow-md: 0 14px 32px -24px rgba(23, 35, 59, .55);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    background:
      radial-gradient(900px 420px at 8% -200px, rgba(255, 210, 74, .28) 0%, rgba(255, 210, 74, 0) 70%),
      radial-gradient(1100px 560px at 50% -260px, #ffffff 0%, rgba(255, 255, 255, 0) 72%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* One line of text for a screen reader only */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .shell {
    width: min(1060px, 100% - 40px);
    margin-inline: auto;
    padding: 24px 0 56px;
  }

  /* ---------- The board: one white panel holding the header band and the whole sheet ---------- */
  .board {
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--surface);
    box-shadow: var(--shadow-md);
  }

  /* ---------- Header band: "Welcome, <user>" + page stamp + Sign out ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--blue-line);
    border-radius: 19px 19px 0 0;
    background: var(--blue-soft);
  }

  .welcome {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    font-size: 15px;
  }

  .welcome .mark {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(140deg, var(--amber) 0%, var(--amber-strong) 100%);
    box-shadow: var(--shadow-sm);
  }

  .welcome .label { color: var(--ink-soft); font-weight: 500; }

  .welcome .name {
    font-weight: 700;
    letter-spacing: -.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .welcome .name[data-state="offline"],
  .welcome .name[data-state="empty"] { color: var(--ink-soft); }

  .topbar-right {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* The page stamp: the same dashed pill every screen wears */
  .stamp {
    flex: none;
    padding: 6px 12px;
    border: 1px dashed var(--blue-line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .72);
    color: var(--ink-faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* Sign out: POSTs /logout so the API clears the HttpOnly session_id cookie */
  .signout {
    padding: 7px 14px;
    border: 1px solid var(--blue-line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-soft);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, opacity .15s ease;
  }

  .signout:hover { color: var(--ink); border-color: var(--ink-faint); }

  .signout:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .signout[disabled] { opacity: .6; cursor: progress; }

  /* ---------- Breadcrumb back to the dashboard ---------- */
  .crumbs { padding: 12px 18px 0; }

  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .02em;
    text-decoration: none;
    transition: color .15s ease, border-color .15s ease;
  }

  .home-link:hover { color: var(--ink); border-color: var(--ink-faint); }

  .home-link:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- The sheet itself ---------- */
  .sheet { padding: 14px 18px 18px; }

  /* The company/status line: which record is on the sheet, or why it could not be read */
  .sheet-note {
    margin: 0 0 14px;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .sheet-note[data-state="ready"] { color: var(--ink); font-weight: 600; }
  .sheet-note[data-state="error"] { color: var(--danger); font-weight: 600; }


  /* ---------- The sketch's three frames: Scores on the left, Prices and the extras stacked ----------
     The left frame holds the four scores and grows tall; the right column stacks the three prices
     above the rank + probability pair, exactly the two boxes the sketch draws on that side. */
  .panels {
    display: grid;
    grid-template-columns: minmax(0, 1.04fr) minmax(0, .96fr);
    gap: 14px;
    align-items: stretch;
  }

  /* The left frame runs the full height of the right column — the tall box the sketch draws */
  .panel-scores { height: 100%; }

  .panel-stack {
    display: grid;
    gap: 14px;
  }

  .panel {
    padding: 14px 16px 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }

  .panel-head { margin-bottom: 14px; }

  /* The small amber bar the sketch draws at the left of every heading */
  .panel-title {
    position: relative;
    margin: 0;
    padding-left: 12px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -.005em;
  }

  .panel-title::before {
    content: "";
    position: absolute;
    left: 0;
    top: 2px;
    bottom: 2px;
    width: 3px;
    border-radius: 2px;
    background: var(--amber-strong);
  }

  /* One column of boxes inside a frame, spaced like the sketch's stacked bars */
  .panel-body {
    display: grid;
    gap: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .field-label {
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .01em;
  }

  .field-label .field-note {
    margin-left: 4px;
    color: var(--ink-faint);
    font-weight: 500;
    font-size: 11px;
  }


  /* ---------- The boxes: home.html's light-amber textbox, one per figure ----------
     2px amber frame + amber-soft fill + amber-ink text is exactly how home.html draws its
     company box, so the sheet keeps one look for every figure and a score, a price and the
     grade all read as amber things written on the page. */
  .field input[type="number"] {
    width: 100%;
    min-height: 54px;
    padding: 8px 14px;
    border: 2px solid var(--amber-strong);
    border-radius: 12px;
    background: var(--amber-soft);
    color: var(--amber-ink);
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    box-shadow: var(--shadow-sm);
    transition: background-color .16s ease, box-shadow .16s ease, border-color .16s ease;
  }

  .field input[type="number"]:hover { background: var(--amber-hover); }

  .field input[type="number"]:focus {
    outline: none;
    background: var(--amber-lit);
    box-shadow: 0 0 0 4px rgba(229, 169, 0, .28), var(--shadow-sm);
  }

  .field input[type="number"]::placeholder { color: var(--amber-placeholder); font-weight: 500; }

  /* ---------- A unit drawn inside the box: the sketch's "% / 100" on the probability ---------- */
  .control {
    position: relative;
    display: block;
  }

  .control input[type="number"] { padding-right: 88px; }

  .suffix {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--amber-ink);
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .01em;
    opacity: .72;
    pointer-events: none;
  }


  /* ---------- Rank: the sketch's filled box with the grade in it ----------
     A grade is picked from the six letters the app grades with (calc.js's normalizeGrade),
     so this is a <select> — but it wears the same amber box as every figure and drops the
     native chrome: the letter itself is what says "this is the grade". */
  .rank-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 100%;
    max-width: 168px;
    min-height: 92px;
    padding: 10px 14px;
    border: 2px solid var(--amber-strong);
    border-radius: var(--radius);
    background: var(--amber-soft);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: background-color .16s ease, box-shadow .16s ease;
  }

  .rank-box:hover { background: var(--amber-hover); }

  .rank-box:focus-within {
    background: var(--amber-lit);
    box-shadow: 0 0 0 4px rgba(229, 169, 0, .28), var(--shadow-sm);
  }

  /* A click anywhere in the box lands on the select, so the name inside is decoration only */
  .rank-name {
    color: var(--amber-ink);
    font-size: 12px;
    font-weight: 600;
    opacity: .72;
    pointer-events: none;
    user-select: none;
  }

  .rank-select {
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--amber-ink);
    font: inherit;
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    text-align-last: center;
    cursor: pointer;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }

  .rank-select:focus { outline: none; }

  /* An ungraded record prints grey, the same rule the analysis sheet's pill follows:
     grey means "not graded yet", amber means "graded". */
  .rank-box[data-state="empty"] {
    border-color: #cbd7e8;
    background: #f1f4fa;
    box-shadow: none;
  }

  .rank-box[data-state="empty"] .rank-select,
  .rank-box[data-state="empty"] .rank-name { color: var(--ink-faint); }


  /* ---------- Sticky action bar: Reset + amber Submit, with the answer beside them ---------- */
  .sheet-footer {
    position: sticky;
    bottom: 16px;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 18px;
    margin-top: 14px;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 255, 255, .93);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(6px);
  }

  .foot-hint {
    margin: 0;
    max-width: 62ch;
    color: var(--ink-faint);
    font-size: 13px;
  }

  .foot-hint[data-state="done"] { color: var(--done); }
  .foot-hint[data-state="warn"] { color: var(--warn); }

  .foot-hint[data-state="error"] {
    color: var(--danger);
    font-weight: 600;
  }

  .buttons {
    display: flex;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 22px;
    border: 1px solid transparent;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .12s ease;
  }

  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .btn-amber {
    background: linear-gradient(150deg, var(--amber) 0%, var(--amber-strong) 100%);
    color: var(--amber-ink);
    box-shadow: 0 12px 24px -16px rgba(229, 169, 0, .95);
  }

  .btn-amber:hover { transform: translateY(-1px); }

  .btn-amber[disabled] {
    background: #e7e9ee;
    color: var(--ink-faint);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  .btn-soft {
    border-color: var(--blue-line);
    background: var(--blue-soft);
    color: var(--blue-ink);
  }

  .btn-soft:hover { background: #d8e5f8; }

  .btn-soft[disabled] { opacity: .6; cursor: progress; }

  /* ---------- Responsive: the two frames fold into one column ---------- */
  @media (max-width: 860px) {
    .panels { grid-template-columns: minmax(0, 1fr); }
  }

  @media (max-width: 560px) {
    .shell { width: calc(100% - 24px); padding-top: 16px; }
    .topbar {
      flex-wrap: wrap;
      row-gap: 10px;
      padding: 12px 14px;
    }
    .topbar-right { width: 100%; justify-content: space-between; }
    .stamp { font-size: 10px; letter-spacing: .08em; }
    .crumbs { padding: 10px 14px 0; }
    .sheet { padding: 12px 14px 14px; }
    .panel { padding: 12px 12px 14px; }
    .field input[type="number"] { min-height: 50px; font-size: 16px; }
    .rank-box { max-width: none; min-height: 80px; }
    /* On a phone a floating bar would cover the last box, so it sits in the page instead */
    .sheet-footer { position: static; padding: 12px; }
    .buttons { width: 100%; }
    .buttons .btn { flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<body>
<main class="shell">
  <div class="board">

    <!-- Header band mirrors every other page in the app: welcome, stamp, Sign out -->
    <header class="topbar">
      <div class="welcome">
        <span class="mark" aria-hidden="true"></span>
        <span class="label">Welcome,</span>
        <span class="name" id="username" data-state="loading">&hellip;</span>
      </div>
      <div class="topbar-right">
        <span class="stamp">Score update</span>
        <button class="signout" id="signout-button" type="button">Sign out</button>
      </div>
    </header>

    <nav class="crumbs" aria-label="Breadcrumb">
      <a class="home-link" href="home.html">&larr; Back to dashboard</a>
    </nav>

    <!--
      The scores sheet — the second half of the hand-over middle.html starts with
      ?type=update-score and lands here as update-score.html?company_name=<the name>.

      It asks the one question /update_analysis answers without a document: the numbers.
      No report box and no memo exist on this page, so the body carries figures only and the
      API keeps every stored .html section untouched (its own partial-update rule).

      The absolute API URL, not "/update_analysis": this page is served by static hosting,
      which answers 405 to a POST on a static route, while the API lives on its own host. The
      script below intercepts the submit and reports the answer in the footer; this action= /
      method= / enctype= trio is the no-JavaScript fallback.

      Every part is named exactly as the column the API serves it as — company_name, symbol,
      moat_score, cyclical_score, anti_fragile_score, growth_score, target_price, bad_price,
      good_price, rank, winning_probability — so the payload needs no renaming layer. Two
      notes on the wire format:
        - `winning_probability` is a fraction 0..1 on the API while the box shows a
          percentage out of 100 (the sketch's "% / 100"), so buildSubmission() divides by 100
          — the same conversion calc.js makes for the Add company sheet;
        - there is no `date` part: the new version is dated by the server.
    -->
    <form class="sheet" id="update-form" autocomplete="off"
          action="https://api.kidsfunbank.ca/update_analysis" method="post"
          enctype="multipart/form-data">

      <p class="sheet-note" id="sheet-note" data-state="loading" role="status"
         aria-live="polite">Reading the company on file&hellip;</p>

      <!--
        The two parts that say WHICH row is being written. They are not on the sketch: the
        company is chosen on the dashboard, so the sheet states it in the note above and keeps
        the values here where buildSubmission() reads them. `symbol` is the one the API looks a
        company up by (an unknown symbol is a 404), and `company_name` travels with it because
        it is a required column of the same model.
      -->
      <input type="hidden" name="company_name" id="company_name" value="">
      <input type="hidden" name="symbol" id="symbol" value="">

      <div class="panels">

        <!-- Left frame: the four marks out of 100 -->
        <section class="panel panel-scores" aria-labelledby="scores-title">
          <div class="panel-head">
            <h2 class="panel-title" id="scores-title">Scores</h2>
          </div>
          <div class="panel-body">

            <div class="field">
              <label class="field-label" for="score-moat_score">
                Moat score <span class="field-note">/100</span>
              </label>
              <input id="score-moat_score" type="number" name="moat_score"
                     min="0" max="100" step="1" inputmode="numeric" placeholder="&mdash;">
            </div>

            <div class="field">
              <label class="field-label" for="score-cyclical_score">
                Cyclical score <span class="field-note">/100</span>
              </label>
              <input id="score-cyclical_score" type="number" name="cyclical_score"
                     min="0" max="100" step="1" inputmode="numeric" placeholder="&mdash;">
            </div>

            <div class="field">
              <label class="field-label" for="score-anti_fragile_score">
                Anti-fragile score <span class="field-note">/100</span>
              </label>
              <input id="score-anti_fragile_score" type="number" name="anti_fragile_score"
                     min="0" max="100" step="1" inputmode="numeric" placeholder="&mdash;">
            </div>

            <div class="field">
              <label class="field-label" for="score-growth_score">
                Growth score <span class="field-note">/100</span>
              </label>
              <input id="score-growth_score" type="number" name="growth_score"
                     min="0" max="100" step="1" inputmode="numeric" placeholder="&mdash;">
            </div>

          </div>
        </section>


        <!-- Right column: the three prices above the grade and the probability -->
        <div class="panel-stack">

          <section class="panel panel-prices" aria-labelledby="prices-title">
            <div class="panel-head">
              <h2 class="panel-title" id="prices-title">Prices</h2>
            </div>
            <div class="panel-body">

              <!-- The sketch's order, top to bottom: target, bad, good -->
              <div class="field">
                <label class="field-label" for="price-target_price">Target price</label>
                <input id="price-target_price" type="number" name="target_price"
                       min="0" step="0.01" inputmode="decimal" placeholder="&mdash;">
              </div>

              <div class="field">
                <label class="field-label" for="price-bad_price">Bad price</label>
                <input id="price-bad_price" type="number" name="bad_price"
                       min="0" step="0.01" inputmode="decimal" placeholder="&mdash;">
              </div>

              <div class="field">
                <label class="field-label" for="price-good_price">Good price</label>
                <input id="price-good_price" type="number" name="good_price"
                       min="0" step="0.01" inputmode="decimal" placeholder="&mdash;">
              </div>

            </div>
          </section>

          <section class="panel panel-additional" aria-labelledby="additional-title">
            <div class="panel-head">
              <h2 class="panel-title" id="additional-title">Additional info</h2>
            </div>
            <div class="panel-body">

              <!--
                Rank: one of the six letters the app grades with. The box states the stored
                grade on load (amber box) and turns grey with the empty option when the record
                has none, so "not graded yet" is visible at a glance.
              -->
              <div class="field">
                <label class="rank-box" id="rank-box" data-state="empty" for="rank">
                  <span class="rank-name" aria-hidden="true">Rank</span>
                  <select class="rank-select" id="rank" name="rank">
                    <option value="">&mdash;</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                  </select>
                </label>
              </div>

              <!-- The sketch's "% / 100": the analyst types a percentage, the API gets a fraction -->
              <div class="field">
                <label class="field-label" for="winning_probability">Winning probability</label>
                <span class="control">
                  <input id="winning_probability" type="number" name="winning_probability"
                         min="0" max="100" step="0.1" inputmode="decimal" placeholder="&mdash;">
                  <span class="suffix" aria-hidden="true">% / 100</span>
                </span>
              </div>

            </div>
          </section>

        </div>
      </div>

      <!-- Sticky action bar: what Submit will send on the left, Reset + amber Submit on the right -->
      <div class="sheet-footer">
        <p class="foot-hint" id="submit-hint" role="status" aria-live="polite">
          Submit posts the ten figures on this sheet to /update_analysis &mdash; no reports are
          attached, so every stored document stays as it is.
        </p>
        <div class="buttons">
          <button class="btn btn-soft" type="reset">Reset</button>
          <button class="btn btn-amber" id="submit-button" type="submit">Submit</button>
        </div>
      </div>
    </form>
  </div>
</main>


<!--
  Session gate — runs before the sheet's own script.
  A static page can be opened by its URL without ever passing the sign-in screen, so every
  screen in this app probes the API first and leaves for login.html when it says 401/403.
  GET /getuser is the only honest check: the session_id cookie is HttpOnly and scoped to the
  API host, so document.cookie can never see it (the same probe index.html, login.html,
  home.html, viewcompany.html, addcompany.html, middle.html, portfolioanalytics.html and
  update-analysis.html use).
    200                         -> stay and let the sheet read the company
    401 / 403                   -> login.html (missing or expired session)
    5xx / timeout / unreachable -> stay; the sheet says what it could not read
  Kept inline and separate from the page script on purpose: the gate must run even if the
  script below never executes, and it must not depend on a cached copy of anything.
-->
<script>
(function () {
  'use strict';

  const API_BASE = 'https://api.kidsfunbank.ca';
  const USER_PATH = '/getuser';
  const SIGNED_OUT_PAGE = 'login.html';
  const PROBE_TIMEOUT_MS = 5000;

  /**
   * Input: none.
   * Output: the HTTP status of GET /getuser, or 0 when the API could not be reached.
   * Action: GETs /getuser with credentials: 'include' — the only way the HttpOnly
   *         session_id cookie travels to api.kidsfunbank.ca — without caching, waiting at
   *         most PROBE_TIMEOUT_MS; the body is never read, only the status.
   * Role: turns "is this visitor signed in?" into one number the gate can test.
   */
  async function probeSession() {
    if (typeof fetch !== 'function') return 0;

    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = controller ? setTimeout(function () { controller.abort(); }, PROBE_TIMEOUT_MS) : null;

    try {
      const response = await fetch(API_BASE + USER_PATH, {
        method: 'GET',
        headers: { Accept: 'application/json' },
        cache: 'no-store',
        credentials: 'include',
        signal: controller ? controller.signal : undefined
      });
      return response.status;
    } catch (error) {
      return 0;
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  /**
   * Input: a status from probeSession().
   * Output: true when the API refused the probe for lack of a session (401/403).
   * Action: compares the status with the two refusal codes.
   * Role: narrows "not signed in" to what the API actually said, so a timeout or a flaky
   *       connection never throws away a half-typed sheet.
   */
  function isSignedOut(status) {
    return status === 401 || status === 403;
  }

  /**
   * Input: none.
   * Output: none (it navigates).
   * Action: replaces this page with login.html.
   * Role: the single exit for an absent or expired session, so the sheet never sits in the
   *       Back history behind the sign-in screen.
   */
  function leaveForSignIn() {
    window.location.replace(SIGNED_OUT_PAGE);
  }

  /**
   * Input: none.
   * Output: nothing (it may navigate away).
   * Action: probes the session once and sends a refused visitor to login.html.
   * Role: entry point of the gate — typing this page's URL while signed out ends on the
   *       sign-in screen instead of on a sheet that could never be saved.
   */
  async function guard() {
    if (isSignedOut(await probeSession())) leaveForSignIn();
  }

  guard();
})();
</script>



<script>
/**
 * ---------------------------------------------------------------------------
 * Data contract
 *   GET  https://api.kidsfunbank.ca/getuser           -> { user_name, ... } for the greeting
 *   GET  https://api.kidsfunbank.ca/companies-s/{key} -> one company, wrapped:
 *          { numerical_values: { company_name, symbol, rank, moat_score, cyclical_score,
 *            anti_fragile_score, growth_score, winning_probability, target_price, bad_price,
 *            good_price, current_price, ... }, analysis_files: [ ... ] }
 *          (the key may be a symbol or a name - but a name answers an EMPTY record today,
 *          see findInList(), which is why a name falls back to the list read)
 *   GET  https://api.kidsfunbank.ca/companies         -> { count, companies: [ flat rows ] }
 *   POST https://api.kidsfunbank.ca/update_analysis   -> the answer the footer reports
 *   POST https://api.kidsfunbank.ca/logout            -> clears the session_id cookie
 *
 * This is the page middle.html?type=update-score hands over to:
 * update-score.html?company_name=<the name>. It reads that company and fills the three
 * frames with what is already on file, so an update starts from the stored figures.
 *
 * What Submit sends (multipart/form-data, every part named as the column it is):
 *   company_name, symbol, moat_score, cyclical_score, anti_fragile_score, growth_score,
 *   target_price, bad_price, good_price, rank, winning_probability.
 *   - no file part and no memo exist on this page: the request is a numbers-only update, so
 *     the API keeps all thirteen stored documents exactly as they are;
 *   - `winning_probability` travels as the fraction 0..1 the API models, though the box holds
 *     a 0..100 percentage (the sketch's "% / 100"), so the value is divided by 100;
 *   - a blank box is left out, so the API keeps what is stored (its own partial-update rule);
 *   - there is no `date` part: the new version is dated by the server, as /addcompany does.
 * ---------------------------------------------------------------------------
 */
'use strict';

const API_BASE = 'https://api.kidsfunbank.ca';

const ENDPOINTS = {
  user: '/getuser',
  companies: '/companies',
  // The one-company read: /companies-s/{symbol} answers the wrapped record above.
  company: (key) => '/companies-s/' + encodeURIComponent(key),
  logout: '/logout',
  update: '/update_analysis'
};

// The endpoint name the footer and every failure sentence use.
const SUBMIT_LABEL = '/update_analysis';
const SIGNED_OUT_PAGE = 'login.html';
const REQUEST_TIMEOUT_MS = 8000;

// The six letters the app grades with — the same list calc.js normalizes a rank against.
const GRADES = ['A', 'B', 'C', 'D', 'E', 'F'];

// The grade and the probability are read from the record through their own key lists: the
// probability's stored form is a fraction, so it cannot go through the plain text reader.
const RANK_KEYS = ['rank', 'grade'];
const PROBABILITY_KEYS = ['winning_probability', 'winningProbability', 'probability'];

/**
 * Every box the sheet writes, with the things a figure needs:
 *   keys      — the record spellings it is filled from (the API's own first);
 *   min / max — the ends that are clamped on blur and before the POST (max null = no top);
 *   decimals  — how much of the number survives (0 = a whole mark, 2 = a price, 1 = a percent);
 *   label/why — the sentence the footer uses when a typed value had to be corrected.
 * The insertion order is the order the parts are appended in, so the request reads like the
 * sheet: the four scores, then the three prices, then the probability.
 */
const RULES = {
  moat_score: {
    keys: ['moat_score', 'moatScore'],
    label: 'Moat score', min: 0, max: 100, decimals: 0,
    why: 'a score runs from 0 to 100 in whole marks'
  },
  cyclical_score: {
    keys: ['cyclical_score', 'cyclicalScore'],
    label: 'Cyclical score', min: 0, max: 100, decimals: 0,
    why: 'a score runs from 0 to 100 in whole marks'
  },
  anti_fragile_score: {
    keys: ['anti_fragile_score', 'antiFragileScore', 'antifragile_score'],
    label: 'Anti-fragile score', min: 0, max: 100, decimals: 0,
    why: 'a score runs from 0 to 100 in whole marks'
  },
  growth_score: {
    keys: ['growth_score', 'growthScore'],
    label: 'Growth score', min: 0, max: 100, decimals: 0,
    why: 'a score runs from 0 to 100 in whole marks'
  },
  target_price: {
    keys: ['target_price', 'targetPrice'],
    label: 'Target price', min: 0, max: null, decimals: 2,
    why: 'a price has at most two decimals and cannot be negative'
  },
  bad_price: {
    keys: ['bad_price', 'badPrice'],
    label: 'Bad price', min: 0, max: null, decimals: 2,
    why: 'a price has at most two decimals and cannot be negative'
  },
  good_price: {
    keys: ['good_price', 'goodPrice'],
    label: 'Good price', min: 0, max: null, decimals: 2,
    why: 'a price has at most two decimals and cannot be negative'
  },
  winning_probability: {
    keys: PROBABILITY_KEYS,
    label: 'Winning probability', min: 0, max: 100, decimals: 1,
    why: 'a probability runs from 0 to 100 percent'
  }
};

// What the footer says before anything is sent, and after a Reset.
const DEFAULT_HINT = 'Submit posts the ten figures on this sheet to /update_analysis \u2014 no reports are attached, so every stored document stays as it is.';

const LOG_PREFIX = '[update-score]';

let submitting = false;

/**
 * Input: none (reads window.location.search).
 * Output: { value, kind } for the company the sheet is about — kind is 'name' or 'symbol' —
 *         or null when the URL names no company.
 * Action: reads ?company_name= (what middle.html writes), then ?name= and ?symbol=.
 * Role: the one place the page learns which record it is updating.
 */
function readKey() {
  const params = new URLSearchParams(window.location.search);
  const name = (params.get('company_name') || params.get('name') || '').trim();
  if (name) return { value: name, kind: 'name' };

  const symbol = (params.get('symbol') || '').trim();
  if (symbol) return { value: symbol, kind: 'symbol' };

  return null;
}

/**
 * Input: any value a record may hold — text, a number, null, an object.
 * Output: trimmed text, "" for null/undefined, or "" for anything worth nothing on screen.
 * Action: numbers become their digits, strings are trimmed, everything else yields "".
 * Role: one reader for the boxes, so a null column never prints "null" in a box.
 */
function asText(value) {
  if (value === null || value === undefined) return '';
  if (typeof value === 'number') return Number.isFinite(value) ? String(value) : '';
  return typeof value === 'string' ? value.trim() : '';
}

/**
 * Input: a company record and a list of candidate keys, best spelling first.
 * Output: the first value found, or undefined when none of the keys hold anything.
 * Action: looks inside numerical_values first (the /companies-s/{key} wrapper), then at the
 *         record itself (the flat rows /companies answers), skipping empty values.
 * Role: one reader for both API shapes, so the boxes are fed the same way whichever route
 *       filled them — and a renamed field only needs its spelling added to RULES.
 */
function pick(record, keys) {
  if (!record || typeof record !== 'object') return undefined;

  const sources = [record.numerical_values, record];
  for (const source of sources) {
    if (!source || typeof source !== 'object') continue;
    for (const key of keys) {
      const value = source[key];
      if (value !== null && value !== undefined && value !== '') return value;
    }
  }

  return undefined;
}

/**
 * Input: an object fetched from the API.
 * Output: true when it carries a company at all.
 * Action: prefers a company name (then a symbol) as the sign that the record is real.
 * Role: answers "did this read bring a company back, or an empty shell?", which is what a
 *       name lookup returns today.
 */
function hasCompany(record) {
  return asText(pick(record, ['company_name', 'symbol'])) !== '';
}


/**
 * Input: a box's raw value, a record value, or anything else.
 * Output: the number it stands for, or null when it holds no number.
 * Action: accepts finite numbers, and text with surrounding spaces and thousand separators.
 * Role: the one numeric reader behind the boxes, the percentages and the clamping rules.
 */
function toNumber(value) {
  if (value === null || value === undefined) return null;
  if (typeof value === 'number') return Number.isFinite(value) ? value : null;

  const text = String(value).trim().replace(/,/g, '');
  if (text === '') return null;

  const number = Number(text);
  return Number.isFinite(number) ? number : null;
}

/**
 * Input: a number.
 * Output: its shortest honest text — four decimals at most, so 430.4000000000001 reads 430.4.
 * Action: rounds to four decimals and lets String() drop the trailing zeros.
 * Role: keeps float noise out of a box that is about to be posted back verbatim.
 */
function trimNumber(value) {
  if (!Number.isFinite(value)) return '';
  return String(Math.round(value * 10000) / 10000);
}

/**
 * Input: the `name` of a numeric box and its raw value.
 * Output: the value rewritten as that box's rule allows (a whole 0..100 mark, a price with at
 *         most two decimals and no negative, a percentage with one), or "" when there is no
 *         number in it.
 * Action: takes the rule from RULES, rounds to its decimals and clamps both ends.
 * Role: one rule for the blur and for the POST, so the figure on screen is the figure sent.
 */
function normalizeText(name, raw) {
  const rule = RULES[name];
  if (!rule) return '';

  const number = toNumber(raw);
  if (number === null) return '';

  const factor = Math.pow(10, rule.decimals);
  let value = Math.round(number * factor) / factor;

  if (value < rule.min) value = rule.min;
  if (rule.max !== null && value > rule.max) value = rule.max;

  return trimNumber(value);
}

/**
 * Input: a stored winning probability — the API's fraction (0.6) or, defensively, a
 *        percentage written by an older build (60).
 * Output: the text the box shows — a percentage out of 100 (60), or "" when there is no number.
 * Action: treats 0..1 as the API's fraction and anything above 1 as an already-percent value,
 *         then rounds to one decimal.
 * Role: the sketch's box holds "% / 100", so the stored fraction has to be shown as a percent.
 */
function toPercentText(value) {
  const number = toNumber(value);
  if (number === null) return '';

  const fraction = number > 1 ? number / 100 : number;
  return trimNumber(Math.round(fraction * 1000) / 10);
}

/**
 * Input: a percentage from the box (0..100, one decimal at most).
 * Output: the fraction the API stores, as text — 62.5 becomes "0.625", 60 becomes "0.6".
 * Action: divides by 100 through an integer round, which keeps 0.6 out of float noise.
 * Role: the one conversion between the sketch's "% / 100" and the API's 0..1 column.
 */
function toFractionText(percent) {
  const number = toNumber(percent);
  if (number === null) return '';
  return trimNumber(Math.round(number * 10) / 1000);
}


/**
 * Input: an API path such as "/companies-s/0700.HK".
 * Output: the parsed JSON body.
 * Action: GETs API_BASE + path with credentials: 'include' — the HttpOnly session_id cookie
 *         only travels when credentials are included — without caching, aborting after
 *         REQUEST_TIMEOUT_MS, and throws an Error carrying .status on any non-2xx.
 * Role: the single read helper for the user and company calls.
 */
async function fetchJson(path) {
  const controller = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = controller ? setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS) : null;

  try {
    const response = await fetch(API_BASE + path, {
      method: 'GET',
      headers: { Accept: 'application/json' },
      cache: 'no-store',
      credentials: 'include',
      signal: controller ? controller.signal : undefined
    });

    if (!response.ok) {
      const error = new Error('HTTP ' + response.status);
      error.status = response.status;
      throw error;
    }

    return await response.json();
  } finally {
    if (timer) clearTimeout(timer);
  }
}

/**
 * Input: the body /getuser answered with.
 * Output: the username, or "" when the body holds none.
 * Action: tries user_name first, then the other spellings the API may use, at the top level
 *         or nested under data / user / result, and accepts a bare string body.
 * Role: fills the "Welcome, <user>" line; the greeting is never invented.
 */
function toUsername(payload) {
  if (typeof payload === 'string') return payload.trim();
  if (!payload || typeof payload !== 'object') return '';

  const candidates = [payload.user_name, payload.userName, payload.username, payload.user, payload.name, payload.data];
  for (const candidate of candidates) {
    if (typeof candidate === 'string' && candidate.trim()) return candidate.trim();
    if (candidate && typeof candidate === 'object') {
      const nested = toUsername(candidate);
      if (nested) return nested;
    }
  }

  return '';
}

/**
 * Input: an error thrown by fetchJson().
 * Output: true when the API refused the request for lack of a session (401/403).
 * Action: reads the .status fetchJson() attaches to its errors.
 * Role: separates "signed out" (back to login.html) from "no such company" and "endpoint
 *       broke" (stay on the sheet and say so).
 */
function isSignedOut(error) {
  return Boolean(error) && (error.status === 401 || error.status === 403);
}

/**
 * Input: an error thrown by fetchJson().
 * Output: one short sentence for the status line.
 * Action: names the HTTP status when there is one, and the two likely causes otherwise.
 * Role: every read failure is explained in one place instead of a blank sheet.
 */
function describeError(error) {
  if (error && error.status) return 'the API answered HTTP ' + error.status + '.';
  if (error && error.name === 'AbortError') return 'the API took too long to answer.';
  return 'the API could not be reached.';
}

/**
 * Input: none.
 * Output: none (it navigates).
 * Action: replaces the page with login.html.
 * Role: the single exit for an absent or expired session.
 */
function leaveForSignIn() {
  window.location.replace(SIGNED_OUT_PAGE);
}


/**
 * Input: the text for the line above the frames, and its data-state
 *        ("loading" / "ready" / "error").
 * Output: none.
 * Action: writes #sheet-note and marks its state for the colour.
 * Role: says which company is on the sheet, or why it could not be read.
 */
function setNote(text, state) {
  const note = document.getElementById('sheet-note');
  if (!note) return;
  note.textContent = text;
  note.dataset.state = state;
}

/**
 * Input: the text for the sticky footer, and its data-state
 *        ("" / "warn" / "done" / "error").
 * Output: none.
 * Action: writes #submit-hint and marks its state.
 * Role: the one line that reports what a box was corrected to and what Submit did.
 */
function setHint(text, state) {
  const hint = document.getElementById('submit-hint');
  if (!hint) return;
  hint.textContent = text;
  hint.dataset.state = state || '';
}

/**
 * Input: the text for the greeting and its data-state ("ready" / "empty" / "offline").
 * Output: none.
 * Action: writes #username and marks its state for the muted colour.
 * Role: keeps the header honest when /getuser is unreadable.
 */
function setUsername(text, state) {
  const name = document.getElementById('username');
  if (!name) return;
  name.textContent = text;
  name.dataset.state = state;
}

/**
 * Input: none.
 * Output: none.
 * Action: GETs /getuser and fills the greeting, or sends a refused visitor to login.html.
 * Role: the "Welcome, <user>" line, read from the API that owns the session.
 */
async function loadUser() {
  try {
    const name = toUsername(await fetchJson(ENDPOINTS.user));
    if (name) setUsername(name, 'ready');
    else setUsername('\u2014', 'empty');
  } catch (error) {
    if (isSignedOut(error)) {
      leaveForSignIn();
      return;
    }
    setUsername('\u2014', 'offline');
  }
}

/**
 * Input: none.
 * Output: none (it navigates).
 * Action: POSTs /logout with credentials: 'include', then replaces the page with
 *         login.html whatever the answer was.
 * Role: the only way to end the session — the session_id cookie is HttpOnly, so no page can
 *       delete it itself.
 */
async function signOut() {
  const button = document.getElementById('signout-button');
  if (button) {
    button.disabled = true;
    button.textContent = 'Signing out\u2026';
  }

  try {
    await fetch(API_BASE + ENDPOINTS.logout, { method: 'POST', credentials: 'include' });
  } catch (error) {
    console.warn(LOG_PREFIX + ' sign-out failed', error);
  }

  window.location.replace(SIGNED_OUT_PAGE);
}


/**
 * Input: the `name` of one box and the text to put in it.
 * Output: none.
 * Action: sets the box's value and its default value.
 * Role: the only writer of a box during the read. Writing the default too means Reset brings
 *       the company's stored figure back instead of blanking the sheet.
 */
function setValue(name, value) {
  const input = document.querySelector('#update-form [name="' + name + '"]');
  if (!input) return;
  input.value = value;
  input.defaultValue = value;
}

/**
 * Input: the `name` of a file-less sheet's box — here only 'rank' is special.
 * Output: none.
 * Action: swaps the amber/grey state of the rank box to match the select's current value.
 * Role: keeps "graded" (amber) and "not graded yet" (grey) in step with the control, on load
 *       and after every change of the grade.
 */
function syncRankBox() {
  const select = document.getElementById('rank');
  const box = document.getElementById('rank-box');
  if (!select || !box) return;

  const known = GRADES.indexOf(String(select.value).trim().toUpperCase()) !== -1;
  box.dataset.state = known ? 'ready' : 'empty';
}

/**
 * Input: the rank a record holds (a letter, or anything else).
 * Output: none.
 * Action: selects that letter in the Rank box, marks the option as the default (so Reset
 *         restores the stored grade rather than blanking it) and repaints the box.
 * Role: an update starts from the stored grade, and the box says at a glance whether the
 *       company has one.
 */
function setRank(rank) {
  const select = document.getElementById('rank');
  const grade = String(rank === null || rank === undefined ? '' : rank).trim().toUpperCase();
  const known = GRADES.indexOf(grade) !== -1;
  const wanted = known ? grade : '';

  if (select) {
    for (const option of Array.from(select.options)) {
      // defaultSelected is what a <select> resets to — a select has no defaultValue of its own
      option.defaultSelected = option.value === wanted;
    }
    select.value = wanted;
  }

  syncRankBox();
}

/**
 * Input: one company record (wrapped or flat).
 * Output: none.
 * Action: writes the identity into the two hidden parts and every figure into its box — the
 *         four scores and the three prices through RULES, the probability as a percentage out
 *         of 100, the grade into the Rank box — and fills the rank pill's state.
 * Role: an update starts from what is on file, so every box opens holding the stored figure.
 */
function fillForm(record) {
  setValue('company_name', asText(pick(record, ['company_name', 'companyName', 'name'])));
  setValue('symbol', asText(pick(record, ['symbol', 'ticker', 'code'])));

  for (const name of Object.keys(RULES)) {
    if (name === 'winning_probability') continue;
    setValue(name, asText(pick(record, RULES[name].keys)));
  }

  setValue('winning_probability', toPercentText(pick(record, PROBABILITY_KEYS)));
  setRank(pick(record, RANK_KEYS));
}


/**
 * Input: the sheet's focusout event (a box that was typed in loses the caret).
 * Output: none.
 * Action: rewrites the box through normalizeText() when the typed value breaks its rule, and
 *         says so in the footer — "Moat score was rounded to 84 — a score runs from 0 to 100
 *         in whole marks." An empty box is left alone (it means "keep the stored figure").
 * Role: the sheet corrects a number while the analyst watches instead of rejecting the POST
 *       later, the same way the Add company sheet does it.
 */
function handleBlur(event) {
  const input = event.target;
  if (!input || !input.name || !Object.prototype.hasOwnProperty.call(RULES, input.name)) return;

  const before = String(input.value).trim();
  if (before === '') return;

  const after = normalizeText(input.name, before);
  if (after === '' || after === before) return;

  input.value = after;
  const rule = RULES[input.name];
  setHint(rule.label + ' was rounded to ' + after + ' \u2014 ' + rule.why + '.', 'warn');
}

/**
 * Input: the name a ?company_name= link carried.
 * Output: the matching row of GET /companies, or null when no row matches.
 * Action: reads the list once and compares the name, then the symbol, case-insensitively.
 * Role: the fallback that makes a name usable. /companies-s/<a name> answers an empty record
 *       today (only a symbol fills it), so a name would otherwise leave every box blank.
 */
async function findInList(name) {
  const payload = await fetchJson(ENDPOINTS.companies);
  const rows = Array.isArray(payload)
    ? payload
    : (payload && Array.isArray(payload.companies) ? payload.companies : []);
  const wanted = name.trim().toLowerCase();

  const match = rows.find(function (row) {
    if (!row || typeof row !== 'object') return false;
    return asText(row.company_name).toLowerCase() === wanted ||
      asText(row.symbol).toLowerCase() === wanted;
  });

  return match || null;
}

/**
 * Input: none (reads ?company_name= / ?symbol= off the URL).
 * Output: none.
 * Action: reads the company the sheet is about — /companies-s/{key} first, the /companies list
 *         when a name answers an empty record — and fills the three frames with it. A missing
 *         key or an unknown company is explained on the sheet, which stays usable: Submit still
 *         posts whatever is on it, and the API keeps the rest.
 * Role: the page's opening read, the counterpart of viewcompany.html's one-company call.
 */
async function loadCompany() {
  const key = readKey();

  if (!key) {
    setNote('This page was opened without a company \u2014 start from Update score on the dashboard.', 'error');
    return;
  }

  setNote('Reading \u201c' + key.value + '\u201d\u2026', 'loading');

  try {
    let record = null;

    try {
      record = await fetchJson(ENDPOINTS.company(key.value));
    } catch (error) {
      if (isSignedOut(error)) {
        leaveForSignIn();
        return;
      }
      if (!error || error.status !== 404) throw error;
    }

    if (!hasCompany(record) && key.kind === 'name') record = await findInList(key.value);

    if (!hasCompany(record)) {
      setNote('No company called \u201c' + key.value + '\u201d is on file \u2014 check the spelling, ' +
        'or add it with Add company first.', 'error');
      return;
    }

    fillForm(record);

    const name = asText(pick(record, ['company_name'])) || key.value;
    const symbol = asText(pick(record, ['symbol']));
    setNote('Updating the scores of ' + name + (symbol ? ' (' + symbol + ')' : '') +
      ' \u2014 every box opens holding the figure on file; change what moved, then Submit.',
      'ready');
    document.title = name + ' \u00b7 Update score \u00b7 RR research';
  } catch (error) {
    if (isSignedOut(error)) {
      leaveForSignIn();
      return;
    }
    setNote('Could not read \u201c' + key.value + '\u201d \u2014 ' + describeError(error), 'error');
  }
}


/**
 * Input: the <form> element.
 * Output: { body, sent } — the multipart body to POST, and how many parts of each kind it
 *         carries ({ parts, files }).
 * Action: appends company_name, symbol, the four scores, the three prices, the rank and the
 *         probability — each one normalised by the same rule the blur uses, so the wire always
 *         carries a legal number. The probability is divided by 100 (the API's fraction). A
 *         blank box is skipped, so the API keeps the stored figure; there is no file part, no
 *         memo and no `date`, which is what makes this a numbers-only update.
 * Role: the exact request body Submit posts to /update_analysis. Every key is the sheet's own
 *       `name` attribute, and every one of those is a company column, so a backend field is
 *       found by reading the markup rather than a translation table.
 */
function buildSubmission(form) {
  const body = new FormData();
  const sent = { parts: 0, files: 0 };

  const add = function (name, value) {
    const text = value === null || value === undefined ? '' : String(value).trim();
    if (text === '') return;
    body.append(name, text);
    sent.parts += 1;
  };

  const identity = form.elements.company_name;
  const symbol = form.elements.symbol;
  add('company_name', identity ? identity.value : '');
  add('symbol', symbol ? symbol.value : '');

  for (const name of Object.keys(RULES)) {
    const input = form.elements[name];
    if (!input) continue;

    const text = normalizeText(name, input.value);
    if (text === '') continue;

    // The sketch's "% / 100" box holds 0..100; the API models the same figure as 0..1.
    add(name, name === 'winning_probability' ? toFractionText(text) : text);
  }

  const rank = form.elements.rank;
  add('rank', rank ? rank.value : '');

  return { body, sent };
}

/**
 * Input: the <form> element and whether a save is in flight.
 * Output: none.
 * Action: disables Submit and Reset, renames Submit "Submitting…" and sets aria-busy on the form.
 * Role: one save at a time — a second click cannot post the sheet twice.
 */
function setBusy(form, busy) {
  const button = document.getElementById('submit-button');
  const reset = form ? form.querySelector('button[type="reset"]') : null;

  if (button) {
    button.disabled = busy;
    button.textContent = busy ? 'Submitting\u2026' : 'Submit';
  }
  if (reset) reset.disabled = busy;
  if (form) form.setAttribute('aria-busy', busy ? 'true' : 'false');
}


/**
 * Input: the form's submit event (a click on Submit, or Enter in a box).
 * Output: a Promise that settles once the API answered, or null when nothing was sent.
 * Action: keeps the browser from posting, insists the record carries a company name and a
 *         symbol (the API looks the row up by symbol and 404s an unknown one), builds the body
 *         with buildSubmission(), POSTs it to /update_analysis as multipart/form-data, then
 *         reports the answer in the footer.
 * Role: the page's only write. Nothing navigates away, so a refused save leaves every figure
 *       exactly where the analyst typed it.
 */
async function submitSheet(event) {
  if (event) event.preventDefault();
  if (submitting) return null;

  const form = document.getElementById('update-form');
  if (!form) return null;

  const nameBox = form.elements.company_name;
  const symbolBox = form.elements.symbol;
  const company = nameBox ? nameBox.value.trim() : '';
  const symbol = symbolBox ? symbolBox.value.trim() : '';

  // The identity parts come from the record, not from a box on this sheet: an empty one means
  // the record itself is incomplete, and the API needs both to know which row to touch.
  if (!company || !symbol) {
    setHint('Cannot save \u2014 this record has no ' + (company ? 'symbol' : 'company name') +
      ' on file, and the API needs both. Set it with Add company, then start Update score ' +
      'again from the dashboard.', 'error');
    return null;
  }

  submitting = true;
  setBusy(form, true);

  const submission = buildSubmission(form);
  // The resolved URL, not the short label: a 405 in the console is nearly always the page host
  // refusing a POST on a static route, and naming the host is what tells the two apart.
  console.log(LOG_PREFIX + ' submit \u2192 ' + API_BASE + ENDPOINTS.update);
  console.log(LOG_PREFIX + ' submission: ' + submission.sent.parts + ' figure part(s), no file');
  setHint('Saving \u2014 posting ' + submission.sent.parts + ' figure(s) to ' + SUBMIT_LABEL +
    ' (no reports attached)\u2026', 'warn');

  try {
    const response = await fetch(API_BASE + ENDPOINTS.update, {
      method: 'POST',
      // No Content-Type header: a FormData body makes fetch write
      // `multipart/form-data; boundary=<random>` itself, and hand-setting the header would drop
      // the boundary, so the server could not parse a part at all.
      body: submission.body,
      credentials: 'include'
    });

    if (response.ok) {
      setHint('Saved \u2014 ' + SUBMIT_LABEL + ' answered HTTP ' + response.status + ' (' +
        submission.sent.parts + ' figure(s); every stored report was left as it is).', 'done');
    } else if (response.status === 401 || response.status === 403) {
      setHint('Not saved \u2014 the session was refused (HTTP ' + response.status +
        '). Sign in again, then Submit once more.', 'error');
    } else if (response.status === 404) {
      setHint('Not saved \u2014 the API has no company with symbol ' + symbol + ' (HTTP 404). ' +
        'Add it with Add company first, then start Update score again.', 'error');
    } else if (response.status === 405) {
      setHint('Not saved \u2014 HTTP 405 from ' + API_BASE + ENDPOINTS.update + ': that host serves ' +
        'pages only. Reload this page (Cmd+Shift+R) and Submit again.', 'error');
    } else if (response.status === 422) {
      setHint('Not saved \u2014 the API refused the figures (HTTP 422). Check the four scores ' +
        '(0\u2013100), the prices and the probability (0\u2013100 percent), then Submit again.', 'error');
    } else {
      setHint('Not saved \u2014 ' + SUBMIT_LABEL + ' answered HTTP ' + response.status + '.', 'error');
    }

    return response;
  } catch (error) {
    const reason = (error && error.message) ? error.message : 'network error';
    setHint('Not saved \u2014 could not reach ' + SUBMIT_LABEL + ' (' + reason + ').', 'error');
    return null;
  } finally {
    submitting = false;
    setBusy(form, false);
  }
}

/**
 * Input: the form's reset event.
 * Output: none.
 * Action: lets the browser put every box back to its default — which is the company's stored
 *         record, because setValue() and setRank() write the defaults too — then repaints the
 *         rank box and restores the footer's opening line on the next tick.
 * Role: Reset undoes the edit, not the company: it never blanks a record that was read.
 */
function handleReset() {
  window.setTimeout(function () {
    syncRankBox();
    setHint(DEFAULT_HINT, '');
  }, 0);

  console.log(LOG_PREFIX + ' reset \u2192 the stored record');
}

/**
 * Input: none (the script sits at the end of <body>, so the DOM already exists).
 * Output: none.
 * Action: starts the greeting and the company read, then wires Submit, Reset, the corrections
 *         on blur, the rank box and the sign-out button.
 * Role: single entry point for the page.
 */
function init() {
  loadUser();
  loadCompany();

  const form = document.getElementById('update-form');
  if (form) {
    form.addEventListener('submit', submitSheet);
    form.addEventListener('reset', handleReset);
    // focusout bubbles where blur does not, so one listener covers every box on the sheet
    form.addEventListener('focusout', handleBlur);
  }

  const rank = document.getElementById('rank');
  if (rank) rank.addEventListener('change', syncRankBox);

  const signOutButton = document.getElementById('signout-button');
  if (signOutButton) signOutButton.addEventListener('click', signOut);
}

init();
</script>
</body>
</html>
