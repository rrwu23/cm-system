<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Company desk</title>
<style>
  /* ---------- Design tokens: identical palette to home.html ---------- */
  :root {
    --bg: #eef2f8;
    --surface: #ffffff;
    --ink: #17233b;
    --ink-soft: #5c6a84;
    --ink-faint: #8d99ae;
    --line: #dde4ef;
    --amber: #ffd24a;
    --amber-strong: #e5a900;
    --amber-soft: #fff5cc;
    --amber-ink: #3a2c00;
    --amber-line: #f0d47a;
    --blue-soft: #e4edfa;
    --blue-line: #c2d4ee;
    --blue-ink: #21456f;
    --focus: #2f6fed;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(23, 35, 59, .06);
    --shadow-md: 0 14px 32px -24px rgba(23, 35, 59, .55);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    background:
      radial-gradient(1100px 560px at 50% -260px, #ffffff 0%, rgba(255, 255, 255, 0) 72%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- One centred column: top bar, sign-in card, cookie note ---------- */
  .shell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    width: min(430px, 100% - 36px);
    min-height: 100%;
    margin-inline: auto;
    padding: 30px 0 48px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 0 2px;
  }

  .welcome {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .welcome .mark {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(140deg, var(--amber) 0%, var(--amber-strong) 100%);
    box-shadow: var(--shadow-sm);
  }

  .welcome .label { color: var(--ink-soft); font-size: 15px; font-weight: 500; }

  .stamp {
    flex: none;
    padding: 6px 12px;
    border: 1px dashed var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .65);
    color: var(--ink-faint);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* ---------- Sign-in card ---------- */
  .panel {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow-md);
  }

  .panel-head {
    padding: 20px 22px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #fbfcff 0%, #f4f8fd 100%);
  }

  .panel-title {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  .panel-hint {
    margin: 0;
    color: var(--ink-faint);
    font-size: 13px;
  }

  .panel-body {
    display: grid;
    gap: 18px;
    padding: 22px 22px 0;
  }

  /* Label sits above each box, as specified */
  .field {
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
  }

  .field-label {
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
  }

  .field input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #d5dfee;
    border-radius: 11px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  .field input:hover { border-color: #c3d1e5; }

  .field input:focus {
    outline: none;
    border-color: var(--amber-strong);
    box-shadow: 0 0 0 4px rgba(255, 210, 74, .32);
  }

  .field input::placeholder { color: var(--ink-faint); }

  /* ---------- Footer: status line, then the amber sign-in button at the bottom ---------- */
  .panel-foot { padding: 20px 22px 22px; }

  .status {
    min-height: 19px;
    margin: 0 0 14px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .status[data-state="busy"] { color: var(--ink-faint); }
  .status[data-state="success"] { color: #1c7a45; font-weight: 600; }
  .status[data-state="error"] { color: #b3261e; font-weight: 600; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    font: inherit;
    cursor: pointer;
    user-select: none;
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
  }

  .btn-amber {
    width: 100%;
    height: 54px;
    border: 1px solid #cf9b00;
    background: linear-gradient(150deg, var(--amber) 0%, var(--amber-strong) 100%);
    color: var(--amber-ink);
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: -.01em;
    box-shadow: var(--shadow-md);
  }

  .btn-amber:not([disabled]):hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 30px -20px rgba(224, 168, 0, .95);
  }

  .btn-amber:not([disabled]):active { transform: translateY(0); }

  .btn-amber[disabled] {
    cursor: progress;
    opacity: .78;
    box-shadow: var(--shadow-sm);
  }

  .btn:focus-visible {
    outline: 3px solid rgba(47, 111, 237, .38);
    outline-offset: 2px;
  }

  .foot-note {
    margin: 0;
    color: var(--ink-faint);
    font-size: 12.5px;
    text-align: center;
  }

  .foot-note code {
    color: var(--blue-ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }

  @media (max-width: 560px) {
    .shell { width: min(430px, 100% - 24px); padding: 20px 0 32px; }
    .stamp { display: none; }
    .panel-head { padding: 18px 18px 16px; }
    .panel-body { padding: 18px 18px 0; }
    .panel-foot { padding: 18px 18px 18px; }
    .panel-title { font-size: 20px; }
    .btn-amber { height: 50px; font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<body>
<main class="shell">
  <!-- Top bar mirrors home.html so the sign-in page reads as the same app -->
  <header class="topbar">
    <div class="welcome">
      <span class="mark" aria-hidden="true"></span>
      <span class="label">Company desk</span>
    </div>
    <span class="stamp">Sign in</span>
  </header>

  <!--
    Posts password / username as application/x-www-form-urlencoded to
    https://api.kidsfunbank.ca/signin. The API answers with the username and the
    HttpOnly session_id cookie; the script below intercepts the submit, then
    opens home.html.
  -->
  <form
    class="panel"
    id="signin-form"
    method="post"
    action="https://api.kidsfunbank.ca/signin"
    aria-labelledby="signin-title">

    <div class="panel-head">
      <h1 class="panel-title" id="signin-title">Sign in</h1>
      <p class="panel-hint">Use the analyst account you were given.</p>
    </div>

    <div class="panel-body">
      <label class="field">
        <span class="field-label">username</span>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
          autofocus>
      </label>

      <label class="field">
        <span class="field-label">password</span>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required>
      </label>
    </div>

    <div class="panel-foot">
      <p class="status" id="signin-status" aria-live="polite"></p>
      <button class="btn btn-amber" id="signin-button" type="submit">Sign in</button>
    </div>
  </form>

  <p class="foot-note">
    The session is kept in the <code>session_id</code> cookie the API sets
    (<code>HttpOnly</code>, so this page cannot read it).
  </p>
</main>

<script>
/**
 * ---------------------------------------------------------------------------
 * Sign-in contract
 *   POST https://api.kidsfunbank.ca/signin
 *        body (application/x-www-form-urlencoded): password=<password>&username=<username>
 *        -> 200 {"username": "<name>"} plus the session, which travels only as
 *           Set-Cookie: session_id=...; HttpOnly; Secure; SameSite=lax; Path=/
 * The cookie belongs to the server: it is HttpOnly, so JavaScript can neither
 * read it nor overwrite it, and the browser keeps it because this fetch asks for
 * credentials: 'include' (the API answers with Access-Control-Allow-Credentials).
 * The body carries just the username, so nothing is stored here — the page
 * confirms who signed in and opens home.html.
 *
 * On load the page also probes GET https://api.kidsfunbank.ca/getuser (same
 * credentials, 5s timeout): a 2xx means the visitor already holds a session, so
 * login.html replaces itself with home.html instead of asking again. Any other
 * outcome is ignored — the form behaves exactly as before.
 * ---------------------------------------------------------------------------
 */
const API_BASE = 'https://api.kidsfunbank.ca';
const ENDPOINTS = { signin: '/signin', user: '/getuser' };
const REQUEST_TIMEOUT_MS = 10000;

/**
 * Timeout for the "is there already a session?" probe. Shorter than a sign-in
 * because nobody waits on it: the form stays usable while it runs.
 */
const SESSION_PROBE_TIMEOUT_MS = 5000;

/** Page opened after a successful sign-in, after a short pause. */
const NEXT_PAGE = 'home.html';
const REDIRECT_DELAY_MS = 600;

/** Response field names accepted as the signed-in username, in priority order. */
const USERNAME_KEYS = ['username', 'user', 'name'];

/**
 * True while POST /signin is in flight. The boot probe reads it so a slow
 * /getuser answer cannot navigate away from a sign-in the user just started.
 */
let submitting = false;

/**
 * Input: an HTTP status (0 when there was no usable response) and the server's
 *        own message, when it sent one.
 * Output: a SignInError instance.
 * Action: keeps status and server message apart from the generic text.
 * Role: the single error type thrown by signIn(); handleSubmit() switches on it.
 */
class SignInError extends Error {
  constructor(status, serverMessage) {
    super(serverMessage || 'HTTP ' + status);
    this.name = 'SignInError';
    this.status = status;
    this.serverMessage = serverMessage || '';
  }
}

/**
 * Input: raw JSON body (or plain text) returned by /signin.
 * Output: the username as a trimmed string, or '' when none was found.
 * Action: accepts a bare string, USERNAME_KEYS on the object itself, and a
 *         username nested one level under data / user / result.
 * Role: the only value worth reading from the response — the session itself is
 *       the HttpOnly session_id cookie, which JavaScript never sees.
 */
function toUsername(payload) {
  if (typeof payload === 'string') return payload.trim();
  if (!payload || typeof payload !== 'object') return '';

  for (const key of USERNAME_KEYS) {
    const value = payload[key];
    if (typeof value === 'string' && value.trim()) return value.trim();
  }

  for (const key of ['data', 'user', 'result']) {
    const nested = toUsername(payload[key]);
    if (nested) return nested;
  }

  return '';
}

/**
 * Input: a parsed payload, a plain-text body, or a validation-error array.
 * Output: the first human-readable message found, or '' when there is none.
 * Action: reads the usual error fields (detail / message / error_description /
 *         error / msg), recurses into nested objects and arrays, and ignores
 *         anything that looks like an HTML page.
 * Role: surfaces whatever the API says instead of a bare status code.
 */
function toMessage(payload) {
  if (typeof payload === 'string') {
    const text = payload.trim();
    if (!text || text.indexOf('<') !== -1) return '';
    return text.slice(0, 200);
  }

  if (Array.isArray(payload)) {
    for (const item of payload) {
      const found = toMessage(item);
      if (found) return found;
    }
    return '';
  }

  if (!payload || typeof payload !== 'object') return '';

  for (const key of ['detail', 'message', 'error_description', 'error', 'msg']) {
    const found = toMessage(payload[key]);
    if (found) return found;
  }

  return '';
}

/**
 * Input: a response body as text.
 * Output: the parsed JSON value, or the original text when it is not JSON.
 * Action: swallows the SyntaxError of JSON.parse.
 * Role: lets signIn() cope with a JSON token, a plain token or a plain-text error.
 */
function parsePayload(text) {
  try {
    return JSON.parse(text);
  } catch (error) {
    return text;
  }
}

/**
 * Input: the sign-in form element.
 * Output: { username, password } — username trimmed, password exactly as typed.
 * Action: reads the two named controls, tolerating a missing control. Both are
 *         required by /signin (password first in the body); the username is also
 *         what the response echoes back, so it doubles as the display name.
 * Role: single place that harvests the credentials, so the POST body and the
 *       confirmation line both use the same values.
 */
function readCredentials(form) {
  const username = form.elements.username;
  const password = form.elements.password;

  return {
    username: username ? username.value.trim() : '',
    password: password ? password.value : ''
  };
}

/**
 * Input: { username, password }.
 * Output: the parsed /signin response body ({ username }).
 * Action: POSTs the credentials URL-encoded (password first, matching the wire
 *         format) with credentials: 'include', so the browser accepts and stores
 *         the HttpOnly session_id cookie the API sets; aborts after
 *         REQUEST_TIMEOUT_MS and throws a SignInError carrying the server message
 *         on any non-2xx status.
 * Role: the single network helper of the page.
 */
async function signIn(credentials) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

  try {
    const body = new URLSearchParams();
    body.set('password', credentials.password);
    body.set('username', credentials.username);

    const response = await fetch(API_BASE + ENDPOINTS.signin, {
      method: 'POST',
      headers: {
        Accept: 'application/json',
        'Content-Type': 'application/x-www-form-urlencoded'
      },
      body: body.toString(),
      cache: 'no-store',
      credentials: 'include',
      signal: controller.signal
    });

    const text = await response.text();
    const payload = text ? parsePayload(text) : null;

    if (!response.ok) {
      throw new SignInError(response.status, toMessage(payload) || toMessage(text));
    }

    return payload;
  } finally {
    clearTimeout(timer);
  }
}

/**
 * Input: none.
 * Output: true when the API still accepts this browser's session cookie.
 * Action: GETs API_BASE + ENDPOINTS.user with credentials: 'include' (the only
 *         way the HttpOnly session_id cookie rides along), cache: 'no-store',
 *         aborting after SESSION_PROBE_TIMEOUT_MS; any non-2xx, timeout, CORS or
 *         network failure counts as "not signed in" instead of throwing.
 * Role: the page's only way to detect an existing session — the cookie is
 *       unreadable from JavaScript — and the same trick index.html uses to route
 *       the bare host.
 */
async function hasSession() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), SESSION_PROBE_TIMEOUT_MS);

  try {
    const response = await fetch(API_BASE + ENDPOINTS.user, {
      method: 'GET',
      headers: { Accept: 'application/json' },
      cache: 'no-store',
      credentials: 'include',
      signal: controller.signal
    });
    return response.ok;
  } catch (error) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

/**
 * Input: none.
 * Output: none (it navigates instead).
 * Action: probes /getuser and, when the API accepts the session, replaces this
 *         page with NEXT_PAGE via location.replace (so Back does not bounce here
 *         again). Every other outcome is silent: no status line, no console
 *         warning, and no navigation while a sign-in is in flight.
 * Role: turns a typed or bookmarked login.html into a door for signed-in
 *       visitors, so they land on the dashboard in one hop.
 */
async function leaveIfSignedIn() {
  if (submitting) return;
  if (!(await hasSession())) return;

  if (submitting) return;
  console.log('[login] session already active \u2014 opening ' + NEXT_PAGE);
  window.location.replace(NEXT_PAGE);
}

/**
 * Input: message text and a state name (busy / success / error / '').
 * Output: none.
 * Action: writes the text with textContent and tags the element with data-state
 *         so the stylesheet can colour it.
 * Role: the page's only feedback channel (it is an aria-live region).
 */
function setStatus(message, state) {
  const status = document.getElementById('signin-status');
  if (!status) return;

  status.textContent = message;
  status.dataset.state = state || '';
}

/**
 * Input: true while the request is in flight, false when it failed.
 * Output: none.
 * Action: disables the button, swaps its label and sets aria-busy on the form.
 * Role: prevents a double submit and tells the user something is happening.
 */
function setBusy(busy) {
  const button = document.getElementById('signin-button');
  const form = document.getElementById('signin-form');
  if (!button || !form) return;

  button.disabled = busy;
  button.textContent = busy ? 'Signing in\u2026' : 'Sign in';
  form.setAttribute('aria-busy', busy ? 'true' : 'false');
}

/**
 * Input: any error thrown by signIn().
 * Output: a short sentence to show under the fields.
 * Action: prefers the server's own message, then maps 401/403 to a credentials
 *         hint, a timeout to its own text, and anything else to "unreachable".
 * Role: keeps every failure mode explicit without leaking internals.
 */
function describeError(error) {
  if (error && error.name === 'SignInError') {
    if (error.serverMessage) return error.serverMessage;
    if (error.status === 401 || error.status === 403) {
      return 'That username and password did not match.';
    }
    return 'Sign-in failed (HTTP ' + error.status + '). Please try again.';
  }

  if (error && error.name === 'AbortError') {
    return 'The sign-in service took too long to answer. Please try again.';
  }

  return 'Could not reach the sign-in service. Check your connection and try again.';
}

/**
 * Input: the form's submit event.
 * Output: none (async).
 * Action: cancels the native post, POSTs the credentials, reads the username out
 *         of the answer — the session itself is the HttpOnly session_id cookie the
 *         API has just set, so nothing is written here — and opens home.html after
 *         a short pause; on failure it re-enables the button, reports the reason
 *         and puts the caret back in the password box for 401/403.
 * Role: the whole behaviour of the page behind the Sign in button.
 */
async function handleSubmit(event) {
  event.preventDefault();

  const form = event.currentTarget;
  const credentials = readCredentials(form);
  const passwordField = form.elements.password;

  setStatus('Signing in\u2026', 'busy');
  setBusy(true);
  submitting = true;

  try {
    // Only the username comes back; the session_id cookie is the server's doing.
    const username = toUsername(await signIn(credentials)) || credentials.username;
    console.log('[signin] session_id cookie set by the API for ' + username);

    setStatus('Signed in as ' + username + ' \u2014 opening the dashboard\u2026', 'success');
    window.setTimeout(() => window.location.assign(NEXT_PAGE), REDIRECT_DELAY_MS);
  } catch (error) {
    const message = describeError(error);
    console.warn('[signin] ' + message, error);

    submitting = false;
    setStatus(message, 'error');
    setBusy(false);

    if (error && (error.status === 401 || error.status === 403) && passwordField) {
      passwordField.focus();
      passwordField.select();
    }
  }
}

/**
 * Input: none (the script sits at the end of <body>, so the DOM already exists).
 * Output: none.
 * Action: wires the submit handler, clears the status line, exposes the helpers
 *         on window.loginPage for console checks, and fires the /getuser probe so
 *         a signed-in visitor is handed straight to NEXT_PAGE.
 * Role: single entry point for the page.
 */
function init() {
  const form = document.getElementById('signin-form');
  if (form) form.addEventListener('submit', handleSubmit);

  setStatus('', '');

  window.loginPage = {
    toUsername,
    toMessage,
    readCredentials,
    signIn,
    hasSession
  };

  // Runs in the background: a visitor who already holds a session never has to
  // read (let alone use) this form.
  leaveIfSignedIn();
}

init();
</script>
</body>
</html>
